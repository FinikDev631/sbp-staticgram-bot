<!DOCTYPE html>
<html lang="ru">
<head>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #F6F2ED;
      color: #24201D;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .box {

      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="box">
    <div style="font-size: 40px; margin-bottom: 16px;">🛠️</div>
    <h1>Технические работы</h1>
    <p>Сайт временно отключён на плановое техническое обслуживание. Пожалуйста, используйте официального бота в Telegram.</p>
  </div>
</body>
</html>
